<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — WISETRACK Engineering Project Control</title>
  <link rel="stylesheet" href="assets/style.css?v=20260926">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer">
  <script src="assets/api.js?v=20260926"></script>
</head>
<body>
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-badge"><i class="fa-solid fa-compass-drafting"></i></div>
      <div>
        <h2 style="font-size: 20px; font-weight: 800; color:#0f172a; margin:0; letter-spacing:-0.4px;">WISETRACK</h2>
        <div style="font-size: 11px; font-weight:700; color: #64748b; text-transform:uppercase; letter-spacing:0.8px;">Engineering & Resort Suite</div>
      </div>
    </div>

    <div class="auth-title">Welcome to Wisetrack</div>
    <p class="auth-desc">Enterprise Engineering Project Control & Multi-Resort Portfolio Suite</p>

    <!-- Quick Role Selector Pills -->
    <div style="margin-bottom: 20px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <span style="font-size: 11px; font-weight: 800; color: var(--text-muted); text-transform:uppercase; letter-spacing:0.5px;">Quick Demo Profiles</span>
        <span class="badge green" style="font-size:10px;"><i class="fa-solid fa-circle-dot" style="font-size:8px;"></i> Live API</span>
      </div>
      <div class="demo-account-pills">
        <button type="button" class="demo-pill active" onclick="selectRole('admin@wisetrack.local', this)" title="Full access to all modules and configurations">👑 Admin</button>
        <button type="button" class="demo-pill" onclick="selectRole('pm@wisetrack.local', this)" title="Project execution, budget baselines & closure">📋 Project Manager</button>
        <button type="button" class="demo-pill" onclick="selectRole('site@wisetrack.local', this)" title="Site logs, daily reports, issue reporting">👷 Site Engineer</button>
        <button type="button" class="demo-pill" onclick="selectRole('finance@wisetrack.local', this)" title="Purchases, actuals, BOQ & R-A-G review">💼 Finance</button>
        <button type="button" class="demo-pill" onclick="selectRole('owner@client.example', this)" title="Restricted external stakeholder view">🌐 External Owner</button>
      </div>
    </div>

    <form onsubmit="handleLogin(event)">
      <div class="field" style="margin-bottom:14px;">
        <label><i class="fa-solid fa-envelope" style="font-size:11px; color:var(--primary); margin-right:4px;"></i> Corporate Email</label>
        <input type="email" id="loginEmail" value="admin@wisetrack.local" required placeholder="name@wisetrack.local">
      </div>

      <div class="field" style="margin-bottom:16px;">
        <label><i class="fa-solid fa-lock" style="font-size:11px; color:var(--primary); margin-right:4px;"></i> Password</label>
        <input type="password" id="loginPass" value="Admin@123" required placeholder="••••••••">
      </div>

      <div id="loginError" style="display:none;background:#fef2f2;border:1px solid #fecaca;color:#991b1b;padding:12px;border-radius:var(--radius-sm);margin-bottom:16px;font-size:12.5px;line-height:1.5;"></div>

      <button type="submit" class="btn primary lg" id="loginBtn" style="width:100%; font-size:14px;">
        <span>Sign In to Workspace</span> <i class="fa-solid fa-arrow-right"></i>
      </button>
    </form>

    <div style="margin-top:20px; text-align:center; font-size:11.5px; color:var(--text-muted); border-top:1px solid var(--border-light); padding-top:14px;">
      API Host: <code id="apiBaseLabel" style="color:var(--primary); font-weight:600;">...</code>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
document.getElementById('apiBaseLabel').textContent = API_BASE;

function selectRole(email, btn) {
  document.getElementById('loginEmail').value = email;
  document.getElementById('loginPass').value = 'Admin@123';
  document.querySelectorAll('.demo-pill').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  showToast(`Profile selected: ${email}`, 'info');
}

function showToast(message, type = 'success') {
  let toast = document.getElementById('toast');
  toast.innerHTML = `<span style="display:inline-flex; align-items:center; gap:8px;"><i class="fa-solid fa-circle-check"></i> ${message}</span>`;
  toast.className = `toast show ${type}`;
  setTimeout(() => toast.classList.remove('show'), 2800);
}

async function handleLogin(e) {
  e.preventDefault();
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPass').value;
  const errBox = document.getElementById('loginError');
  const btn = document.getElementById('loginBtn');
  errBox.style.display = 'none';
  btn.disabled = true;
  btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Signing in...`;

  try {
    const data = await WisetrackAPI.login(email, password);
    localStorage.setItem('WISETRACK_ROLE', (data.roles && data.roles[0]) || 'Admin');
    showToast('Authenticated successfully — redirecting...', 'success');
    setTimeout(() => { window.location.href = 'dashboard.html'; }, 350);
  } catch (err) {
    errBox.style.display = 'block';
    errBox.textContent = 'API sign-in failed: ' + err.message +
      ' | Ensure ASP.NET Core server and PostgreSQL database are running.';
    btn.disabled = false;
    btn.innerHTML = `<span>Sign In to Workspace</span> <i class="fa-solid fa-arrow-right"></i>`;
  }
}
</script>
</body>
</html>
